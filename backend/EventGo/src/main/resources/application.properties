spring.application.name=EventGo

spring.datasource.url=jdbc:mysql://localhost:3306/event_go
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT secret and expiry (1 day). Set via environment variable - never commit a real value.
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000
